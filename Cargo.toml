[package]
name = "password-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Local-first encrypted password manager for Windows"

[lib]
name = "password_manager"
path = "src/lib.rs"

[[bin]]
name = "password-manager"
path = "src/main.rs"

[dependencies]
argon2 = "=0.6.0"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
csv = "=1.4.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
iced = "=0.14.0"
raw-window-handle = "=0.6.2"
secrecy = "=0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
thiserror = "=2.0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi"
] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
