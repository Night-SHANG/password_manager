[package]
name = "password-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Local-first encrypted password manager for Windows"

[lib]
name = "password_manager"
path = "src/lib.rs"

[[bin]]
name = "password-manager"
path = "src/main.rs"

[dependencies]
argon2 = "=0.6.0"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
csv = "=1.4.0"
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto"] }
getrandom = "=0.4.3"
hkdf = "=0.13.0"
pbkdf2 = { version = "=0.12.2", features = ["sha2"] }
iced = { version = "=0.14.0", features = ["tokio", "advanced"] }
raw-window-handle = "=0.6.2"
rfd = "=0.17.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
secrecy = "=0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
sha2-legacy = { package = "sha2", version = "=0.10.9" }
tempfile = "=3.23.0"
thiserror = "=2.0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "=1.13.3"
url = "2.5"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
webbrowser = "=1.2.4"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
iced_test = "=0.14.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
