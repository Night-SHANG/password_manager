name: GUI Review

on:
  workflow_call:
    inputs:
      lock_artifact:
        type: string
        required: true
      lock_sha256:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ICED_TEST_BACKEND: tiny-skia
      RUST_BACKTRACE: "1"
      EXPECTED_LOCK_SHA256: ${{ inputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Receive the shared dependency snapshot
        if: inputs.lock_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.lock_artifact }}
      - name: Verify the dependency snapshot
        shell: pwsh
        run: |
          $actual = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:EXPECTED_LOCK_SHA256 -and $actual -ne $env:EXPECTED_LOCK_SHA256) {
            throw "GUI tests must use the same lockfile as dependency policy and packaging."
          }
          "GUI_LOCK_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cargo metadata --locked --all-features --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Committed dependencies need an explicit lockfile update." }
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Collect exact formatter patch without changing test sources
        if: steps.formatting.outcome == 'failure'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/format-review | Out-Null
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "Formatter could not parse source." }
          git diff --output=target/format-review/rustfmt.patch -- src tests
          Copy-Item Cargo.lock target/format-review/Cargo.lock
          git restore --worktree -- src tests
          if ($LASTEXITCODE -ne 0) { throw "Could not restore submitted sources." }
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Headless GUI interactions and review captures
        shell: pwsh
        run: |
          if (Test-Path target/gui-artifacts) { Remove-Item target/gui-artifacts -Recurse -Force }
          New-Item -ItemType Directory -Force target/gui-artifacts | Out-Null
          @"
          Submitted commit: $env:GITHUB_SHA
          Cargo.lock SHA-256: $env:GUI_LOCK_SHA256
          Backend: tiny-skia
          Reference: user-provided legacy card GUI, not the superseded table layout.
          Captures: headless review evidence, NOT approved golden baselines.
          Logical sizes do not prove OS DPI/IME/session/clipboard/WDA behavior.
          See capture-stages.txt for the last BEGIN/END when a scenario panics.
          "@ | Set-Content target/gui-artifacts/REVIEW-NOTES.txt
          cargo test --lib gui_ --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "GUI tests failed." }
          if ((Get-FileHash Cargo.lock -Algorithm SHA256).Hash -ne $env:GUI_LOCK_SHA256) {
            throw "GUI checks changed the dependency snapshot."
          }
          git diff --exit-code -- . ':(exclude)Cargo.lock'
          if ($LASTEXITCODE -ne 0) { throw "GUI checks changed submitted sources." }
      - name: Retain screenshots and formatter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-review-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/gui-artifacts/**
            target/format-review/**
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce format outcome
        if: always() && steps.formatting.outcome != 'success'
        shell: pwsh
        run: throw "Formatting is a failing gate. Review artifact contains the exact formatter patch."
