[package]
name = "password-manager-windows-capability-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "windows-probe"
path = "src/bin/windows_probe.rs"

[[bin]]
name = "iced-hwnd-probe"
path = "src/bin/iced_hwnd_probe.rs"

[dependencies]
argon2 = "0.6.0"
iced = "0.14.0"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging"
] }
